---
id: torrenttip
name: Torrenttip
description: "Torrenttip (토렌트팁) is a Public KOREAN tracker for Korean media."
language: ko-KR
type: public
encoding: UTF-8
followredirect: true
requestDelay: 2
# to fetch current domain use https://tzip.top/
links:
  - https://torrenttip254.top/
legacylinks:
  - https://torrenttip239.top/
  - https://torrenttip240.top/
  - https://torrenttip241.top/
  - https://torrenttip242.top/
  - https://torrenttip243.top/
  - https://torrenttip244.top/
  - https://torrenttip245.top/
  - https://torrenttip246.top/
  - https://torrenttip247.top/
  - https://torrenttip248.top/
  - https://torrenttip249.top/
  - https://torrenttip250.top/
  - https://torrenttip251.top/
  - https://torrenttip252.top/
  - https://torrenttip253.top/

caps:
  categorymappings:
    - {id: "한국영화", cat: Movies, desc: "한국영화 (Korean Movies)"}
    - {id: "해외영화", cat: Movies/Foreign, desc: "해외영화 (Foreign Movies)"}
    - {id: "해외드라마", cat: TV, desc: "해외드라마 (Foreign TV)"}
    - {id: "한국드라마", cat: TV, desc: "한국드라마 (Korean TV)"}
    - {id: "넷플릭스 영화", cat: Movies, desc: "넷플릭스 영화 (Netflix Movies)"}
    - {id: "넷플릭스 시리즈", cat: TV, desc: "넷플릭스 시리즈 (Netflix TV)"}
    - {id: "예능·오락", cat: Audio/Video, desc: "예능·오락 (Entertainment)"}
    - {id: "다큐·교양", cat: TV/Documentary, desc: "다큐·교양 (Documentary)"}
    - {id: "스포츠", cat: TV/Sport, desc: "스포츠 (Sport)"}
    - {id: "음악", cat: Audio, desc: "음악 (Music)"}
    - {id: "유아·어린이", cat: TV, desc: "유아·어린이 (Children)"}
    - {id: "유튜브", cat: TV, desc: "유튜브 (Youtube)"}
    - {id: "애니메이션", cat: TV/Anime, desc: "애니메이션 (Anime)"}
    - {id: "만화", cat: Books/Comics, desc: "만화 (Manga)"}
    - {id: "게임", cat: Console, desc: "게임 (Games)"}
    - {id: "모바일", cat: PC/Mobile-Other, desc: "모바일 (Mobile)"}
    - {id: "유틸리티", cat: PC, desc: "유틸리티 (Software)"}
    - {id: "전자북·강좌", cat: Books/EBook, desc: "전자북·강좌 (EBooks)"}

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]

settings:
  - name: info_flaresolverr
    type: info_flaresolverr

download:
  infohash:
    hash:
      selector: div.p-2:has(i.fa-magnet)
      filters:
        - name: regexp
          args: ([A-F|a-f|0-9]{40})
    title:
      selector: h1
      filters:
        - name: trim
        - name: validfilename

search:
  paths:
    # https://torrenttip166.com/search?q=2025&sort=time
    - path: search
      inputs:
        page: 1
    - path: search
      inputs:
        page: 2
    - path: search
      inputs:
        page: 3
    # A search without keywords uses the year as the keyword, which Korean TV releases do not have in their title (they carry a date like 261127), so TV categories came back empty. Browse the category pages instead.
    # With keywords these paths build the same request as the first path, and Prowlarr skips repeated requests.
    - path: "{{ if .Keywords }}search{{ else }}c/2/12{{ end }}"
      categories: ["해외드라마"]
      inheritinputs: false
      inputs:
        q: "{{ if .Keywords }}{{ .Keywords }}{{ else }}{{ end }}"
        sort: "{{ if .Keywords }}time{{ else }}{{ end }}"
        page: 1
    - path: "{{ if .Keywords }}search{{ else }}c/2/13{{ end }}"
      categories: ["한국드라마"]
      inheritinputs: false
      inputs:
        q: "{{ if .Keywords }}{{ .Keywords }}{{ else }}{{ end }}"
        sort: "{{ if .Keywords }}time{{ else }}{{ end }}"
        page: 1
    - path: "{{ if .Keywords }}search{{ else }}c/3/15{{ end }}"
      categories: ["넷플릭스 시리즈"]
      inheritinputs: false
      inputs:
        q: "{{ if .Keywords }}{{ .Keywords }}{{ else }}{{ end }}"
        sort: "{{ if .Keywords }}time{{ else }}{{ end }}"
        page: 1
    - path: "{{ if .Keywords }}search{{ else }}c/4/20{{ end }}"
      categories: ["유아·어린이"]
      inheritinputs: false
      inputs:
        q: "{{ if .Keywords }}{{ .Keywords }}{{ else }}{{ end }}"
        sort: "{{ if .Keywords }}time{{ else }}{{ end }}"
        page: 1
    - path: "{{ if .Keywords }}search{{ else }}c/4/17{{ end }}"
      categories: ["다큐·교양"]
      inheritinputs: false
      inputs:
        q: "{{ if .Keywords }}{{ .Keywords }}{{ else }}{{ end }}"
        sort: "{{ if .Keywords }}time{{ else }}{{ end }}"
        page: 1
    - path: "{{ if .Keywords }}search{{ else }}c/5/22{{ end }}"
      categories: ["애니메이션"]
      inheritinputs: false
      inputs:
        q: "{{ if .Keywords }}{{ .Keywords }}{{ else }}{{ end }}"
        sort: "{{ if .Keywords }}time{{ else }}{{ end }}"
        page: 1
  inputs:
    q: "{{ if .Keywords }}{{ .Keywords }}{{ else }}{{ .Today.Year }}{{ end }}"
    sort: time

  rows:
    # rows with [  ] are entries whose details page states: File is no longer available as it expired or has been deleted.
    selector: ul.page-list > li:has(a[href$=".html"][title]):not(:contains("[  ]"))
    filters:
      - name: andmatch

  fields:
    # search pages print the category as [ name ] in the row, category listing pages as a badge
    _category_search:
      selector: div:nth-child(2)
      optional: true
      filters:
        - name: regexp
          args: "\\[ (.+?) \\]"
    _category_listing:
      selector: span.badge
      optional: true
    category:
      text: "{{ if .Result._category_search }}{{ .Result._category_search }}{{ else }}{{ .Result._category_listing }}{{ end }}"
    title:
      selector: a[href$=".html"][title]
      attribute: title
    details:
      selector: a[href$=".html"][title]
      attribute: href
    download:
      selector: a[href$=".html"][title]
      attribute: href
    date:
      selector: div:nth-child(3)
      filters:
        # search pages show 26/11/27, category listing pages show 11/27
        - name: re_replace
          args: ["^(\\d{2}/\\d{2}/\\d{2})$", "20$1"]
        - name: re_replace
          args: ["^(\\d{2}/\\d{2})$", "{{ .Today.Year }}/$1"]
        - name: dateparse
          args: "yyyy/MM/dd"
    size:
      text: 512MB
    seeders:
      text: 1
    leechers:
      text: 1
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
# engine n/a
